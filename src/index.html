        <div class="text-2xl font-bold">

        <nav class="hidden md:flex space-x-4">

          <a href="https://github.com/luizf-lf" target="_blank" rel="noopener noreferrer" class="nav-link">Projetos</a>
          <a href="https://www.linkedin.com/in/luizf-lf/" target="_blank" rel="noopener noreferrer" class="nav-link"
            >Contato</a
          >
        </nav>
        <div class="md:hidden">
          <button id="mobile-menu-button" class="text-gray-300 hover:text-white focus:outline-none">

    <!-- Seção Principal (Landing Page) -->
    <main id="home" class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-24 flex items-center">
      <div class="grid md:grid-cols-2 gap-12 items-center w-full">
        <!-- Lado Esquerdo: Textos -->
        <div class="text-center md:text-left">
          <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black leading-tight">
            Desenvolvendo um <span class="accent-color">novo mundo</span>.
          </h1>
          <p class="mt-4 text-xl sm:text-2xl lg:text-3xl text-gray-400">Uma linha de código por vez.</p>

          <div class="mt-10">
            <a

              target="_blank"
              rel="noopener noreferrer"
              class="inline-block accent-bg text-white font-bold py-3 px-8 rounded-lg text-lg hover:opacity-90 transition-opacity duration-150 shadow-lg"

              <i class="fas fa-paper-plane mr-2"></i> Entre em Contato
            </a>
          </div>
        </div>

        <!-- Lado Direito: Ícones de Tecnologia -->
        <div class="flex justify-center md:justify-end items-center">
          <div class="grid grid-cols-2 gap-4 sm:gap-6 max-w-sm">
            <!-- Ícone JavaScript -->
            <div

              <p class="mt-2 text-sm sm:text-base font-semibold">JavaScript</p>
            </div>
            <!-- Ícone TypeScript -->
            <div
              class="tech-icon-bg p-6 rounded-xl flex flex-col items-center justify-center aspect-square shadow-lg hover:shadow-xl transition-shadow duration-300"
            >
              <i class="fab fa-react text-5xl sm:text-6xl text-blue-400"></i>
              <!-- Usando ícone do React como placeholder visual para TS -->
              <p class="mt-2 text-sm sm:text-base font-semibold">TypeScript</p>
            </div>
            <!-- Ícone Java -->
            <div
              class="tech-icon-bg p-6 rounded-xl flex flex-col items-center justify-center aspect-square shadow-lg hover:shadow-xl transition-shadow duration-300"
            >
              <i class="fab fa-java text-5xl sm:text-6xl text-orange-500"></i>
              <p class="mt-2 text-sm sm:text-base font-semibold">Java</p>
            </div>
            <!-- Ícone TOTVS Fluig -->
            <div
              class="tech-icon-bg p-6 rounded-xl flex flex-col items-center justify-center aspect-square shadow-lg hover:shadow-xl transition-shadow duration-300"
            >
              <!-- Poderia ser um ícone customizado ou um genérico -->
              <i class="fas fa-cogs text-5xl sm:text-6xl accent-color"></i>
              <p class="mt-2 text-sm sm:text-base font-semibold">TOTVS Fluig</p>
